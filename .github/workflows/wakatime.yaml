name: Scheduled WakaTime Update

# Writes the WakaTime language stats (last 7 days) into the "waka" section of
# README.md and commits the change directly to main. No bot branch and no PR.
#
# Data: a public WakaTime share link in JSON format (Chart Type: Languages,
# Date Range: Last 7 Days), in the repository variable WAKATIME_SHARE_URL.
# WakaTime does not accept API keys outside its editor plugins any more.
#
# Push: main is protected. WAKA_PUSH_TOKEN is a fine-grained token of the
# repository owner (this repository only, "Contents: Read and write").
# The owner can bypass the protection, so the push works.

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Runs once a week, on Sunday at midnight (UTC)
  schedule:
    - cron: '0 0 * * 0'

# Only one run at a time
concurrency:
  group: wakatime
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-wakatime:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    # Always main, also when you start a test run from another branch
    - name: Check out main
      uses: actions/checkout@v4
      with:
        ref: main
        token: ${{ secrets.WAKA_PUSH_TOKEN }}

    # The script comes from the branch of this run
    - name: Get the script
      uses: actions/checkout@v4
      with:
        path: .waka-script
        sparse-checkout: .github/scripts
        persist-credentials: false

    - name: Write WakaTime stats into README.md
      env:
        WAKATIME_SHARE_URL: ${{ vars.WAKATIME_SHARE_URL }}
      run: python3 -I .waka-script/.github/scripts/waka_readme.py "$WAKATIME_SHARE_URL" README.md

    - name: Commit and push to main if README.md changed
      run: |
        if git diff --quiet -- README.md; then
          echo "No changes in README.md"
          exit 0
        fi
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        git commit -m "Update WakaTime stats [skip ci]" -- README.md
        git push origin HEAD:main
