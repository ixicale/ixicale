name: Scheduled WakaTime Update

# Writes the WakaTime stats into the "waka" section of README.md and
# commits the change directly to main. No bot branch and no pull request.
#
# main is protected. The push works because WAKA_PUSH_TOKEN is a fine-grained
# token of the repository owner, and the owner can bypass the protection.
# The token has access to this repository only, with "Contents: Read and write".

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Runs once a week, on Sunday at midnight (UTC)
  schedule:
    - cron: '0 0 * * 0'

# Only one run at a time
concurrency:
  group: wakatime
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-wakatime:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Update README using WakaTime
      uses: athul/waka-readme@master
      with:
        WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        GH_TOKEN: ${{ secrets.WAKA_PUSH_TOKEN }}
        TARGET_BRANCH: main
        BLOCKS: ⣀⣄⣤⣦⣶⣷⣿
        AUTHOR_NAME: GitHub Actions Bot
        AUTHOR_EMAIL: actions@github.com
        COMMIT_MESSAGE: Update WakaTime stats [skip ci]
